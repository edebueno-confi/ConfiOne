<!doctype html>
<html lang="pt-BR">
  <head>
    <script type="module">
      // @vitejs/plugin-react@6 com Vite 8 pode transformar componentes com
      // Fast Refresh sem inserir o preambulo no HTML durante o dev server.
      // Instale o runtime antes dos modulos React transformados.
      //
      // A guarda e `import.meta.hot`, e NAO `import.meta.env.DEV`.
      // Dentro de script inline no HTML, o Vite 8 substitui `import.meta.env`
      // por um objeto literal com DEV:false e PROD:true mesmo servindo em
      // desenvolvimento. Com a guarda anterior o bloco inteiro nunca executava,
      // e o dev server entregava tela em branco com "$RefreshSig$ is not
      // defined". `import.meta.hot` so existe no dev server e e removido do
      // build, entao expressa a condicao real sem depender daquela
      // substituicao.
      //
      // Os globais sao definidos ANTES do import do runtime. O import e
      // assincrono; definindo primeiro, o pior caso passa a ser perder o
      // recarregamento a quente, e nao perder a aplicacao.
      if (import.meta.hot) {
        window.$RefreshReg$ = () => {};
        window.$RefreshSig$ = () => (type) => type;
        window.__vite_plugin_react_preamble_installed__ = true;
        try {
          const RefreshRuntime = await import('/@react-refresh');
          const injetar =
            RefreshRuntime.injectIntoGlobalHook ??
            RefreshRuntime.default?.injectIntoGlobalHook;
          injetar?.(window);
        } catch (error) {
          console.warn('[dev] recarregamento a quente indisponivel:', error);
        }
      }
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script>
      // Aplica o tema antes da primeira pintura para evitar flash de tema.
      // Mantido em sincronia com src/lib/theme.ts (mesma chave, mesma marcacao e
      // mesma lista de superficies publicas). Superficie publica e sempre clara:
      // o tema escuro pertence ao ambiente autenticado.
      (function () {
        try {
          var path = window.location.pathname;
          var publicPrefixes = ['/help', '/login', '/access-denied'];
          var isPublicSurface =
            path === '/' ||
            publicPrefixes.some(function (prefix) {
              return path === prefix || path.indexOf(prefix + '/') === 0;
            });

          if (isPublicSurface) {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
            return;
          }

          var stored = window.localStorage.getItem('genius.theme-preference');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <title>GeniusOS — suporte, conhecimento e operação</title>
    <meta
      name="description"
      content="Operacao B2B tecnica do Genius Support OS para suporte, conhecimento e documentacao publica controlada."
    />
    <meta
      name="theme-color"
      content="#141f47"
    />
    <meta
      property="og:title"
      content="GeniusOS"
    />
    <meta
      property="og:description"
      content="Operacao B2B tecnica do Genius Support OS para suporte, conhecimento e documentacao publica controlada."
    />
    <meta
      property="og:type"
      content="website"
    />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
