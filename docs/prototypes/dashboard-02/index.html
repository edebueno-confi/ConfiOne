<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard 02 — protótipos</title>
<style>
:root{color-scheme:light;--bg:#f4f7fb;--surface:#fff;--surface2:#edf3fb;--text:#10233f;--muted:#64748b;--line:#d8e1ee;--blue:#2563eb;--good:#087443;--warn:#9a5b00;--bad:#b42318;--shadow:0 12px 32px #17345e12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,system-ui,sans-serif}body.dark{color-scheme:dark;--bg:#111827;--surface:#1b2638;--surface2:#24344a;--text:#edf4ff;--muted:#a8b7ca;--line:#33465f;--blue:#74a2ff;--good:#65d89e;--warn:#f4c66c;--bad:#ff8d85;--shadow:0 12px 32px #0005}.page{max-width:1240px;margin:auto;padding:22px 28px 54px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.eyebrow{color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px}.top h1{font-size:26px;margin:3px 0}.top p{margin:0;color:var(--muted)}button,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.filter-note{margin-left:auto;color:var(--muted);font-size:12px;padding:10px 0}.status{border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;background:#e8f8ef;color:var(--good)}.status.warn{background:#fff4dc;color:var(--warn)}.status.bad{background:#ffe8e6;color:var(--bad)}.section{margin:24px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:10px}.section h2{font-size:16px;margin:0}.section-head p{margin:2px 0 0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:25px;margin:5px 0}.metric small{color:var(--muted)}.delta{color:var(--good);font-weight:700;font-size:12px}.attention{border-left:4px solid var(--warn)}.domain{min-height:108px}.domain strong{display:block;font-size:20px;margin:3px 0}.domain span{color:var(--muted)}.pipeline-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pipeline{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}.pipeline:last-child{border:0}.pipeline b{display:block}.pipeline small{color:var(--muted)}.pipeline .right{text-align:right;white-space:nowrap}.question{font-size:19px;font-weight:700;margin:0 0 10px}.decision{display:flex;gap:10px;align-items:flex-start}.decision .mark{font-size:20px;color:var(--warn)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.option-label{display:inline-block;color:var(--blue);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.compact .grid{grid-template-columns:repeat(3,minmax(0,1fr))}.compact .pipeline-list{grid-template-columns:1fr}.decision-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.footer-note{color:var(--muted);font-size:12px;margin-top:26px}@media(max-width:900px){.grid,.compact .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.decision-layout{grid-template-columns:1fr}.filter-note{width:100%;margin:0}.pipeline-list{grid-template-columns:1fr}}@media(max-width:560px){.page{padding:16px 14px 36px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:22px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters button,.filter-note{grid-column:1/-1}.grid,.compact .grid{grid-template-columns:1fr}.card{padding:13px}.pipeline{align-items:flex-start}.pipeline .right{white-space:normal}.section{margin:18px 0}}
</style><style>.table{table-layout:fixed;word-break:break-word}</style></head><body><main class="page" id="app"></main><script>
const data={metrics:{revenue:'R$ 284.600',won:'42',conversion:'18,4%',tickets:'126',currentBalance:'R$ 91.300',alerts:'7'},pipelines:[]};
fetch('fixtures.json').then(r=>r.json()).then(d=>{Object.assign(data,d);render()});
const q=new URLSearchParams(location.search), option=(q.get('option')||'a').toLowerCase(), state=q.get('state')||'fresh';
function status(){if(state==='stale')return '<span class="status warn">Atualização atrasada</span>';if(state==='partial')return '<span class="status warn">Dados parciais</span>';if(state==='error')return '<span class="status bad">Fonte indisponível</span>';if(state==='zero')return '<span class="status">Nenhum registro</span>';return '<span class="status">Atualizado há 12 min</span>'}
function metrics(){let m=data.metrics;return `<div class="grid"><article class="card metric"><span class="label">Receita ganha · período</span><strong>${state==='error'?'—':m.revenue}</strong><span class="delta">+14% vs. período anterior</span></article><article class="card metric"><span class="label">Negócios ganhos · período</span><strong>${state==='error'?'—':m.won}</strong><small>HubSpot · fonte ${status()}</small></article><article class="card metric"><span class="label">Conversão · período</span><strong>${state==='partial'?'—':m.conversion}</strong><small>${state==='partial'?'Cobertura insuficiente para comparar.':'HubSpot · 228 negócios avaliados'}</small></article><article class="card metric"><span class="label">Tickets abertos · período</span><strong>${state==='zero'?'0':state==='error'?'—':m.tickets}</strong><small>${state==='zero'?'Nenhum ticket no recorte.':'HubSpot · atualização incremental'}</small></article></div>`}
function current(){let m=data.metrics;return `<div class="grid"><article class="card metric"><span class="label">Saldo vencido · posição atual</span><strong>${m.currentBalance}</strong><small>Não afetado pelo período selecionado.</small></article><article class="card metric attention"><span class="label">Clientes com alerta · posição atual</span><strong>${m.alerts}</strong><small>OMIE + reconciliação HubSpot · ${status()}</small></article><article class="card domain"><span class="label">Pergunta gerencial</span><strong>${state==='error'?'O que precisa ser investigado?':'Onde agir agora?'}</strong><span>${state==='error'?'Uma fonte não respondeu. Os números não devem ser tratados como zero.':'Priorize vencidos e oportunidades com maior impacto.'}</span></article></div>`}
function pipelines(table=false){let rows=data.pipelines.slice(0,5);return table?`<div class="card"><table class="table"><thead><tr><th>Pipeline</th><th>Domínio</th><th>Volume</th><th>Valor</th><th>Variação</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.domain}</td><td>${p.count}</td><td>${p.value}</td><td>${p.change}</td></tr>`).join('')}</tbody></table></div>`:`<div class="card pipeline-list">${rows.map(p=>`<div class="pipeline"><div><b>${p.name}</b><small>${p.domain} · ${p.count} negócios</small></div><div class="right"><b>${p.value}</b><small>${p.change}</small></div></div>`).join('')}</div>`}
function common(){return `<header class="top"><div><span class="eyebrow">Dashboard gerencial · protótipo ${option.toUpperCase()}</span><h1>Visão executiva</h1><p>Uma leitura rápida para decidir onde agir hoje. ${status()}</p></div><button class="primary">Atualizar fontes</button></header><nav class="filters"><select><option>Este mês</option><option>Últimos 90 dias</option></select><select><option>Todos os domínios</option><option>Comercial</option></select><select><option>Todos os pipelines</option></select><button>Mais filtros</button><span class="filter-note">Fontes: HubSpot e OMIE · última consolidação há 12 min</span></nav>`}
function a(){return `${common()}<section class="section"><div class="section-head"><div><h2>Desempenho no período</h2><p>Resultados que obedecem ao recorte selecionado.</p></div></div>${metrics()}</section><section class="section"><div class="section-head"><div><h2>Posição atual</h2><p>Indicadores financeiros não são afetados pelo período selecionado.</p></div></div>${current()}</section><section class="section"><div class="section-head"><div><h2>Exceções que pedem atenção</h2><p>Somente situações com próxima ação clara.</p></div><span class="status warn">2 pontos</span></div><div class="card decision-layout"><div class="decision"><span class="mark">!</span><div><p class="question">Saldo vencido acima do limite de atenção</p><span>7 clientes concentram R$ 34.800 em títulos vencidos.</span></div></div><button>Ver detalhes</button></div></section><section class="section"><div class="section-head"><div><h2>Resumo por domínio</h2><p>Comercial, CS e Financeiro em uma leitura compacta.</p></div></div><div class="grid"><article class="card domain"><span>Comercial</span><strong>R$ 284.600</strong><span>Receita ganha no período</span></article><article class="card domain"><span>CS</span><strong>126</strong><span>tickets abertos no período</span></article><article class="card domain"><span>Financeiro</span><strong>R$ 91.300</strong><span>saldo vencido atual</span></article></div></section><section class="section"><div class="section-head"><div><h2>Pipelines prioritários</h2><p>Até cinco sinais executivos; o detalhe completo fica em Ver todos.</p></div><button>Ver todos</button></div>${pipelines()}</section>`}
function b(){return `${common()}<section class="section"><div class="card"><span class="option-label">Pergunta 1 · resultado</span><p class="question">O desempenho do período está acelerando?</p>${metrics()}</div></section><section class="section"><div class="card decision-layout"><div><span class="option-label">Pergunta 2 · atenção</span><p class="question">O que merece uma decisão agora?</p><p>Vencimentos concentrados e uma fonte parcialmente atualizada podem distorcer a leitura.</p></div><button class="primary">Abrir prioridades</button></div></section><section class="section"><div class="section-head"><div><h2>Próximos pontos de atenção</h2><p>Ordenados por impacto e urgência, não por volume de cards.</p></div></div><div class="grid"><article class="card attention"><b>Financeiro</b><p>7 clientes com saldo vencido.</p><button>Investigar</button></article><article class="card"><b>Comercial</b><p>Enterprise cresceu 22% no período.</p><button>Entender movimento</button></article><article class="card"><b>CS</b><p>8 contas em risco de churn.</p><button>Ver carteira</button></article></div></section><section class="section"><div class="section-head"><div><h2>Pipelines em contexto</h2><p>Mostramos os sinais que sustentam as decisões acima.</p></div><button>Ver todos</button></div>${pipelines()}</section>`}
function c(){return `${common()}<section class="section compact"><div class="section-head"><div><h2>Resumo executivo</h2><p>Uma entrada curta para a navegação analítica.</p></div></div>${metrics()}</section><section class="section compact"><div class="section-head"><div><h2>Domínios</h2><p>Abra um domínio para aprofundar sem comprimir a visão geral.</p></div></div><div class="grid"><article class="card domain"><span>Comercial</span><strong>R$ 284.600</strong><button>Explorar</button></article><article class="card domain"><span>CS</span><strong>126 tickets</strong><button>Explorar</button></article><article class="card domain"><span>Financeiro</span><strong>R$ 91.300</strong><button>Explorar</button></article></div></section><section class="section"><div class="section-head"><div><h2>Pipelines</h2><p>Tabela compacta para comparação; rota futura: /admin/analytics/pipelines.</p></div><button>Ver detalhe</button></div>${pipelines(true)}</section>`}
function render(){document.getElementById('app').innerHTML=option==='b'?b():option==='c'?c():a();if(q.get('theme')==='dark')document.body.classList.add('dark')}
</script></body></html>
