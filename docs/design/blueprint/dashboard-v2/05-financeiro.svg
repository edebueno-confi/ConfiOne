<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:'Segoe UI',sans-serif}.brand{font-size:16px;font-weight:700;fill:#fff}.nav{font-size:13px;fill:#b7c3dd}.ey{font-size:11px;font-weight:700;letter-spacing:1px;fill:#2f6bff}.t{font-size:28px;font-weight:700;fill:#162443}.b{font-size:14px;fill:#6b7892}.l{font-size:10px;font-weight:700;letter-spacing:1px;fill:#6b7892}.v{font-size:25px;font-weight:700;fill:#162443}.s{font-size:12px;fill:#6b7892}.c{font-size:15px;font-weight:700;fill:#162443}.n{font-size:11px;font-weight:600;fill:#2f6bff}.tiny{font-size:10px;fill:#98a3b8}</style><rect width="1600" height="1000" fill="#f4f7fc"/><rect width="216" height="1000" fill="#04133d"/><text x="28" y="34" class="brand">GENIUS SUPPORT OS</text><text x="28" y="58" class="tiny" fill="#7f8ead">COCKPIT OPERACIONAL</text><text x="28" y="125" class="tiny">INTELIGENCIA</text><rect x="16" y="145" width="184" height="42" rx="8" fill="#2f6bff"/><text x="32" y="171" class="nav" fill="white">▦ Dashboard gerencial</text><text x="32" y="218" class="nav">▣ Central de ajuda</text><text x="32" y="264" class="nav">◌ Integrações</text><text x="32" y="310" class="nav">≡ Histórico</text><rect x="216" width="1384" height="64" fill="white" stroke="#dce4f2"/><text x="246" y="38" class="b">Dashboard gerencial / Financeiro</text><text x="1220" y="37" class="tiny">BLUEPRINT V2 - NAO E TELA RUNTIME</text><circle cx="1453" cy="32" r="6" fill="#22c55e"/><text x="1468" y="37" class="s">OMIE · Contas a Receber</text><text x="252" y="108" class="ey">OMIE · CONTAS A RECEBER</text><text x="252" y="142" class="t">Financeiro</text><text x="252" y="169" class="b">Posição, risco, previsão e reconciliação em uma leitura.</text><text x="1300" y="140" class="n">Gerenciar OMIE</text><line x1="252" y1="192" x2="1568" y2="192" stroke="#dce4f2"/><g transform="translate(252 210)"><rect width="1316" height="64" rx="9" fill="white" stroke="#cbd7e8"/><text x="20" y="22" class="l">PERÍODO</text><text x="20" y="47" class="s">Este mes</text><text x="190" y="22" class="l">SITUACAO</text><text x="190" y="47" class="s">Todas⌄</text><text x="360" y="22" class="l">AGING</text><text x="360" y="47" class="s">Todos⌄</text><text x="530" y="22" class="l">CLIENTE</text><text x="530" y="47" class="s">Nome ou CNPJ</text><text x="1130" y="38" class="n">Aplicar · Limpar</text></g><text x="252" y="314" class="c">Posição atual</text><text x="420" y="314" class="s">KPIs agrupados por pergunta financeira, sem gráfico grande em mês curto.</text><g transform="translate(252 334)"><rect width="300" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="300" height="4" fill="#2f6bff"/><text x="18" y="28" class="l">POSIÇÃO</text><text x="18" y="63" class="v">—</text><text x="18" y="86" class="s">saldo em aberto</text></g><g transform="translate(570 334)"><rect width="300" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="300" height="4" fill="#ef4444"/><text x="18" y="28" class="l">RISCO</text><text x="18" y="63" class="v">—</text><text x="18" y="86" class="s">vencido · aging</text></g><g transform="translate(888 334)"><rect width="300" height="104" rx="9" fill="white" stroke="#f5b83d"/><rect width="300" height="4" fill="#f5b83d"/><text x="18" y="28" class="l">PREVISÃO</text><text x="18" y="63" class="v">—</text><text x="18" y="86" class="s">30 · 60 · 90 dias</text></g><g transform="translate(1206 334)"><rect width="362" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="362" height="4" fill="#22c55e"/><text x="18" y="28" class="l">RECONCILIACAO</text><text x="18" y="63" class="v">Indisponível</text><text x="18" y="86" class="s">OMIE × HubSpot</text></g><g transform="translate(252 470)"><rect width="636" height="260" rx="10" fill="white" stroke="#cbd7e8"/><text x="22" y="32" class="c">Aging e previsão</text><text x="22" y="54" class="s">Tabela resumida é mais útil que série diária em mês curto.</text><line x1="22" y1="82" x2="594" y2="82" stroke="#e8eef7"/><text x="22" y="108" class="l">FAIXA</text><text x="300" y="108" class="l">TÍTULOS</text><text x="456" y="108" class="l">SALDO</text><text x="22" y="146" class="b">A vencer</text><text x="300" y="146" class="s">—</text><text x="456" y="146" class="s">—</text><line x1="22" y1="164" x2="594" y2="164" stroke="#e8eef7"/><text x="22" y="198" class="b">90+ dias</text><text x="300" y="198" class="s">—</text><text x="456" y="198" class="s">—</text><text x="22" y="238" class="tiny">Detalhe OMIE somente quando o read model responder.</text></g><g transform="translate(908 470)"><rect width="660" height="260" rx="10" fill="#0f1d3a"/><text x="22" y="32" class="c" style="fill:#fff">Movimento histórico</text><text x="22" y="54" class="s" fill="#b7c3dd">Mensal em semestre/ano; contido em janela de um mês.</text><path d="M28 208 L126 185 L224 192 L322 142 L420 160 L518 108 L614 122" fill="none" stroke="#5b86ff" stroke-width="3"/><line x1="28" y1="208" x2="614" y2="208" stroke="#263a63"/><text x="22" y="240" class="n" fill="#5b86ff">Temporalidade segue o período selecionado</text></g><g transform="translate(252 758)"><rect width="1316" height="128" rx="10" fill="white" stroke="#cbd7e8"/><text x="22" y="32" class="c">Fonte e qualidade</text><text x="22" y="58" class="s">Fonte API OMIE, status e data do snapshot em uma faixa compacta junto ao cabeçalho.</text><text x="22" y="91" class="n">Ver reconciliação →</text></g></svg>
