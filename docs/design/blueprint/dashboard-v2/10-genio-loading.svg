<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:'Segoe UI',sans-serif}.ey{font-size:11px;font-weight:700;letter-spacing:1px;fill:#2f6bff}.t{font-size:28px;font-weight:700;fill:#162443}.b{font-size:14px;fill:#6b7892}.s{font-size:12px;fill:#6b7892}.c{font-size:15px;font-weight:700;fill:#162443}.n{font-size:11px;font-weight:600;fill:#2f6bff}.tiny{font-size:10px;fill:#98a3b8}.brand{font-size:16px;font-weight:700;fill:#fff}.nav{font-size:13px;fill:#b7c3dd}</style><rect width="1600" height="1000" fill="#f4f7fc"/><rect width="216" height="1000" fill="#04133d"/><text x="28" y="34" class="brand">GENIUS SUPPORT OS</text><text x="28" y="58" class="tiny">COCKPIT OPERACIONAL</text><text x="28" y="125" class="tiny">ESTADO DO SISTEMA</text><rect x="16" y="145" width="184" height="42" rx="8" fill="#2f6bff"/><text x="32" y="171" class="nav" fill="white">◌ Loading</text><text x="32" y="218" class="nav">▦ Dashboard gerencial</text><rect x="216" width="1384" height="64" fill="white" stroke="#dce4f2"/><text x="246" y="38" class="b">Estado de carregamento</text><text x="1220" y="37" class="tiny">BLUEPRINT V2 · UI-05</text><text x="252" y="118" class="ey">PRIMEIRA PUBLICAÇÃO · SEM SNAPSHOT</text><text x="252" y="154" class="t">O Gênio está atualizando os dados do HubSpot</text><text x="252" y="184" class="b">Clientes, negócios e atendimentos estão sendo organizados para o Dashboard.</text><g transform="translate(252 238)"><rect width="1316" height="318" rx="16" fill="white" stroke="#dce4f2"/><rect x="26" y="26" width="280" height="266" rx="12" fill="#eaf2ff"/><circle cx="166" cy="132" r="72" fill="#d9e9ff"/><g transform="translate(120 76)"><circle cx="46" cy="42" r="33" fill="#2f6bff"/><rect x="25" y="72" width="42" height="58" rx="18" fill="#2f6bff"/><rect x="19" y="92" width="54" height="13" rx="6" fill="#f04aae"/><circle cx="35" cy="41" r="5" fill="white"/><circle cx="57" cy="41" r="5" fill="white"/><path d="M37 58 Q46 66 55 58" fill="none" stroke="white" stroke-width="2"/><path d="M46 8 V-2" stroke="#f04aae" stroke-width="4"/><circle cx="46" cy="-8" r="4" fill="#f04aae"/></g><text x="52" y="244" class="n">avatar do sistema</text></g><g transform="translate(590 276)"><text x="0" y="0" class="c">Atividade visível, verdade preservada</text><text x="0" y="34" class="s">O movimento comunica que existe trabalho em andamento.</text><text x="0" y="70" class="s">A tela só libera a leitura quando o estado publicado for confirmado.</text><line x1="0" y1="112" x2="768" y2="112" stroke="#dce4f2"/><text x="0" y="150" class="ey">ETAPA ATUAL</text><text x="0" y="180" class="b">Sincronizando HubSpot</text><circle cx="270" cy="176" r="6" fill="#2f6bff"/><text x="0" y="230" class="tiny">Sem percentual, contagem ou promessa de conclusão.</text></g><g transform="translate(252 590)"><rect width="636" height="168" rx="10" fill="#fff4d9"/><text x="22" y="34" class="c">Com snapshot válido</text><text x="22" y="62" class="s">Usar banner compacto e manter os dados anteriores visíveis.</text><text x="22" y="106" class="n">Não bloquear o Dashboard</text></g><g transform="translate(908 590)"><rect width="660" height="168" rx="10" fill="#0f1d3a"/><text x="22" y="34" class="c" style="fill:#fff">Reduced motion</text><text x="22" y="62" class="s" fill="#b7c3dd">Remover voo e partículas móveis; manter avatar, halo estático e texto.</text><text x="22" y="106" class="n" fill="#5b86ff">Mesma informação, menor estímulo</text></g><text x="252" y="824" class="tiny">Blueprint de estado visual: não representa resposta, tempo ou dado real.</text></svg>
