<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:'Segoe UI',sans-serif}.brand{font-size:16px;font-weight:700;fill:#fff}.nav{font-size:13px;fill:#b7c3dd}.ey{font-size:11px;font-weight:700;letter-spacing:1px;fill:#2f6bff}.t{font-size:28px;font-weight:700;fill:#162443}.b{font-size:14px;fill:#6b7892}.l{font-size:10px;font-weight:700;letter-spacing:1px;fill:#6b7892}.v{font-size:27px;font-weight:700;fill:#162443}.s{font-size:12px;fill:#6b7892}.c{font-size:15px;font-weight:700;fill:#162443}.n{font-size:11px;font-weight:600;fill:#2f6bff}.tiny{font-size:10px;fill:#98a3b8}</style><rect width="1600" height="1000" fill="#f4f7fc"/><rect width="216" height="1000" fill="#04133d"/><text x="28" y="34" class="brand">GENIUS SUPPORT OS</text><text x="28" y="58" class="tiny" fill="#7f8ead">COCKPIT OPERACIONAL</text><text x="28" y="125" class="tiny">INTELIGENCIA</text><rect x="16" y="145" width="184" height="42" rx="8" fill="#2f6bff"/><text x="32" y="171" class="nav" fill="white">▦ Dashboard gerencial</text><text x="32" y="218" class="nav">▣ Central de ajuda</text><text x="32" y="264" class="nav">◌ Integrações</text><text x="32" y="310" class="nav">≡ Histórico</text><rect x="216" width="1384" height="64" fill="white" stroke="#dce4f2"/><text x="246" y="38" class="b">Dashboard gerencial</text><text x="1220" y="37" class="tiny">BLUEPRINT V2 - NAO E TELA RUNTIME</text><circle cx="1453" cy="32" r="6" fill="#22c55e"/><text x="1468" y="37" class="s">fontes conectadas</text><text x="252" y="108" class="ey">RESUMO EXECUTIVO</text><text x="252" y="142" class="t">Visão Geral</text><text x="252" y="169" class="b">O que mudou, o que exige atenção e quão confiável é a leitura.</text><line x1="252" y1="192" x2="1568" y2="192" stroke="#dce4f2"/><text x="252" y="218" class="l">RECORTE</text><text x="322" y="218" class="b">Período selecionado</text><rect x="1110" y="202" width="140" height="34" rx="7" fill="white" stroke="#cbd7e8"/><text x="1127" y="224" class="s">Este mes</text><text x="252" y="274" class="c">Leitura instantânea</text><text x="422" y="274" class="s">KPIs lideram recortes de até 31 dias</text><g transform="translate(252 292)"><rect width="304" height="112" rx="10" fill="white" stroke="#cbd7e8"/><rect width="304" height="4" fill="#2f6bff"/><text x="18" y="28" class="l">RECEITA GANHA</text><text x="18" y="63" class="v">—</text><text x="18" y="88" class="s">Indisponível até snapshot válido</text></g><g transform="translate(570 292)"><rect width="304" height="112" rx="10" fill="white" stroke="#cbd7e8"/><rect width="304" height="4" fill="#5b86ff"/><text x="18" y="28" class="l">NEGÓCIOS</text><text x="18" y="63" class="v">—</text><text x="18" y="88" class="s">total · abertos · ganhos</text></g><g transform="translate(888 292)"><rect width="304" height="112" rx="10" fill="white" stroke="#cbd7e8"/><rect width="304" height="4" fill="#22c55e"/><text x="18" y="28" class="l">TICKETS</text><text x="18" y="63" class="v">—</text><text x="18" y="88" class="s">abertos e encerrados</text></g><g transform="translate(1206 292)"><rect width="362" height="112" rx="10" fill="white" stroke="#cbd7e8"/><rect width="362" height="4" fill="#f5b83d"/><text x="18" y="28" class="l">SINAL DE RISCO</text><text x="18" y="63" class="v">Indisponível</text><text x="18" y="88" class="s">sem inventar alerta</text></g><g transform="translate(252 440)"><rect width="790" height="226" rx="10" fill="white" stroke="#cbd7e8"/><text x="22" y="30" class="c">Mapa das áreas</text><text x="22" y="52" class="s">Estado e sinal principal de cada domínio.</text><line x1="22" y1="76" x2="768" y2="76" stroke="#e8eef7"/><text x="22" y="106" class="l">COMERCIAL</text><text x="22" y="135" class="b">Pipeline e conversão</text><text x="22" y="163" class="n">Abrir domínio →</text><text x="260" y="106" class="l">CUSTOMER SUCCESS</text><text x="260" y="135" class="b">Cobertura conceitual</text><text x="260" y="163" class="tiny">Denominador pendente</text><text x="500" y="106" class="l">SUPORTE</text><text x="500" y="135" class="b">Volume e prioridade</text><text x="500" y="163" class="n">Abrir domínio →</text></g><g transform="translate(1064 440)"><rect width="504" height="226" rx="10" fill="#0f1d3a"/><text x="22" y="30" class="c" style="fill:#fff">Trilho de integridade</text><text x="22" y="52" class="s" fill="#b7c3dd">Qualidade e frescor sem caixa administrativa.</text><circle cx="28" cy="91" r="5" fill="#22c55e"/><text x="45" y="96" class="s" fill="white">HubSpot · status canônico</text><circle cx="28" cy="151" r="5" fill="#f5b83d"/><text x="45" y="156" class="s" fill="white">OMIE · leitura financeira</text><text x="45" y="181" class="tiny" fill="#7f8ead">Sem transformar falha em zero</text></g><g transform="translate(252 704)"><rect width="1316" height="122" rx="10" fill="white" stroke="#cbd7e8"/><text x="22" y="30" class="c">Evolução proporcional ao recorte</text><text x="22" y="52" class="s">Até 31 dias: microtendência; histórico maior: série mensal.</text><path d="M24 93 L150 86 L276 91 L402 70 L528 78 L654 60" fill="none" stroke="#2f6bff" stroke-width="3"/><line x1="24" y1="98" x2="654" y2="98" stroke="#dce4f2"/><text x="700" y="88" class="n">A área cresce somente quando houver ganho histórico</text></g><text x="252" y="882" class="tiny">Instantâneo → evolução → detalhe. Blueprint sem dados de produção.</text></svg>
