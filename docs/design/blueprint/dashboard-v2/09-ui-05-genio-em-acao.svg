<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:'Segoe UI',sans-serif}.ey{font-size:11px;font-weight:700;letter-spacing:1px;fill:#5b86ff}.t{font-size:28px;font-weight:700;fill:#f5f8ff}.b{font-size:14px;fill:#b7c3dd}.s{font-size:12px;fill:#7f8ead}.c{font-size:15px;font-weight:700;fill:#f5f8ff}.n{font-size:11px;font-weight:600;fill:#5b86ff}.tiny{font-size:10px;fill:#7f8ead}.brand{font-size:16px;font-weight:700;fill:#fff}.nav{font-size:13px;fill:#b7c3dd}</style><rect width="1600" height="1000" fill="#071126"/><rect width="216" height="1000" fill="#04133d"/><text x="28" y="34" class="brand">GENIUS SUPPORT OS</text><text x="28" y="58" class="tiny">COCKPIT OPERACIONAL</text><text x="28" y="125" class="tiny">ESTADO DO SISTEMA</text><rect x="16" y="145" width="184" height="42" rx="8" fill="#2f6bff"/><text x="32" y="171" class="nav" fill="white">◌ Gênio em ação</text><text x="32" y="218" class="nav">▦ Dashboard gerencial</text><rect x="216" width="1384" height="64" fill="#0b1733" stroke="#263a63"/><text x="246" y="38" class="b">Dashboard gerencial / atualização de fontes</text><text x="1220" y="37" class="tiny">BLUEPRINT V2 · UI-05</text><rect x="216" y="64" width="1384" height="936" fill="#0b1733" opacity=".5"/><text x="252" y="116" class="ey">UI-05 · AVATAR DO SISTEMA</text><text x="252" y="152" class="t">O Gênio está organizando os dados do painel</text><text x="252" y="182" class="b">A atividade é visual; o estado factual continua vindo do ciclo publicado.</text><g transform="translate(252 230)"><rect width="820" height="466" rx="18" fill="#0f1d3a" stroke="#263a63"/><text x="42" y="48" class="c">Processamento em andamento</text><text x="42" y="76" class="s">HubSpot -> OMIE · aguardando confirmação publicada</text><circle cx="410" cy="222" r="126" fill="#132445"/><circle cx="410" cy="222" r="150" fill="none" stroke="#2f6bff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 14"/><path d="M250 346 Q410 298 570 346" fill="none" stroke="#5b86ff" stroke-opacity=".45" stroke-width="4"/><g transform="translate(353 124)"><circle cx="57" cy="45" r="42" fill="#2f6bff"/><rect x="30" y="83" width="54" height="72" rx="22" fill="#2f6bff"/><rect x="23" y="108" width="68" height="15" rx="7" fill="#f04aae"/><circle cx="43" cy="44" r="7" fill="white"/><circle cx="71" cy="44" r="7" fill="white"/><circle cx="43" cy="44" r="3" fill="#162443"/><circle cx="71" cy="44" r="3" fill="#162443"/><path d="M45 64 Q57 74 69 64" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/><path d="M57 3 L57 -12" stroke="#f04aae" stroke-width="5" stroke-linecap="round"/><circle cx="57" cy="-19" r="5" fill="#f04aae"/><path d="M28 108 L7 123 M86 108 L107 123" stroke="#2f6bff" stroke-width="14" stroke-linecap="round"/></g><circle cx="240" cy="175" r="4" fill="#f04aae"/><circle cx="590" cy="164" r="4" fill="#6ad1e7"/><circle cx="610" cy="278" r="4" fill="#f5b83d"/><text x="42" y="408" class="s">Sem fantasma, sem caixa mística, sem progresso inventado.</text><text x="42" y="438" class="n">A tela será liberada quando o estado publicado for confirmado.</text></g><g transform="translate(1110 230)"><rect width="458" height="466" rx="14" fill="#0f1d3a" stroke="#263a63"/><text x="26" y="42" class="c">Regras de estado</text><circle cx="30" cy="84" r="5" fill="#2f6bff"/><text x="48" y="89" class="s">Sem snapshot: overlay pode bloquear</text><circle cx="30" cy="126" r="5" fill="#22c55e"/><text x="48" y="131" class="s">Com snapshot: banner não bloqueante</text><circle cx="30" cy="168" r="5" fill="#ef4444"/><text x="48" y="173" class="s">Falha/timeout: encerra animação</text><line x1="26" y1="206" x2="432" y2="206" stroke="#263a63"/><text x="26" y="244" class="ey">PERSONA VISUAL</text><text x="26" y="276" class="b">Avatar tecnológico</text><text x="26" y="304" class="s">forma definida · presença discreta</text><text x="26" y="360" class="ey">REDUCED MOTION</text><text x="26" y="392" class="s">avatar estático + halo + mesmo texto</text></g><text x="252" y="780" class="tiny">A magia está no movimento controlado, não em uma estética sobrenatural.</text></svg>
