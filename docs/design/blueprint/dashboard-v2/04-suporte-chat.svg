<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:'Segoe UI',sans-serif}.brand{font-size:16px;font-weight:700;fill:#fff}.nav{font-size:13px;fill:#b7c3dd}.ey{font-size:11px;font-weight:700;letter-spacing:1px;fill:#167c9b}.t{font-size:28px;font-weight:700;fill:#162443}.b{font-size:14px;fill:#6b7892}.l{font-size:10px;font-weight:700;letter-spacing:1px;fill:#6b7892}.v{font-size:25px;font-weight:700;fill:#162443}.s{font-size:12px;fill:#6b7892}.c{font-size:15px;font-weight:700;fill:#162443}.n{font-size:11px;font-weight:600;fill:#167c9b}.tiny{font-size:10px;fill:#98a3b8}</style><rect width="1600" height="1000" fill="#f4f7fc"/><rect width="216" height="1000" fill="#04133d"/><text x="28" y="34" class="brand">GENIUS SUPPORT OS</text><text x="28" y="58" class="tiny" fill="#7f8ead">COCKPIT OPERACIONAL</text><text x="28" y="125" class="tiny">INTELIGENCIA</text><rect x="16" y="145" width="184" height="42" rx="8" fill="#2f6bff"/><text x="32" y="171" class="nav" fill="white">Dashboard gerencial</text><text x="32" y="218" class="nav">Central de ajuda</text><text x="32" y="264" class="nav">Integracoes</text><text x="32" y="310" class="nav">Historico</text><rect x="216" width="1384" height="64" fill="white" stroke="#dce4f2"/><text x="246" y="38" class="b">Dashboard gerencial / Suporte &amp; Chat</text><text x="1220" y="37" class="tiny">BLUEPRINT V2 - NAO E TELA RUNTIME</text><circle cx="1453" cy="32" r="6" fill="#22c55e"/><text x="1468" y="37" class="s">tickets HubSpot</text><text x="252" y="108" class="ey">HUBSPOT · TICKETS</text><text x="252" y="142" class="t">Suporte &amp; Chat</text><text x="252" y="169" class="b">Tickets primeiro; Chat aparece separado quando houver contrato.</text><line x1="252" y1="192" x2="1568" y2="192" stroke="#dce4f2"/><g transform="translate(252 210)"><rect width="1316" height="64" rx="9" fill="white" stroke="#cbd7e8"/><text x="20" y="22" class="l">PERÍODO</text><text x="20" y="47" class="s">Este mes</text><text x="186" y="22" class="l">STATUS</text><text x="186" y="47" class="s">Todos</text><text x="352" y="22" class="l">PRIORIDADE</text><text x="352" y="47" class="s">Todas</text><text x="532" y="22" class="l">PIPELINE</text><text x="532" y="47" class="s">Todos os pipelines</text><text x="1130" y="38" class="n">Aplicar · Limpar</text></g><text x="252" y="314" class="c">Fila em uma leitura</text><text x="420" y="314" class="s">Estado operacional ocupa o primeiro plano; tendência fica compacta.</text><g transform="translate(252 334)"><rect width="300" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="300" height="4" fill="#2f6bff"/><text x="18" y="28" class="l">TICKETS ABERTOS</text><text x="18" y="63" class="v">-</text><text x="18" y="86" class="s">posição atual</text></g><g transform="translate(570 334)"><rect width="300" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="300" height="4" fill="#f5b83d"/><text x="18" y="28" class="l">BACKLOG</text><text x="18" y="63" class="v">-</text><text x="18" y="86" class="s">a confirmar</text></g><g transform="translate(888 334)"><rect width="300" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="300" height="4" fill="#22c55e"/><text x="18" y="28" class="l">ENCERRADOS</text><text x="18" y="63" class="v">-</text><text x="18" y="86" class="s">fluxo do período</text></g><g transform="translate(1206 334)"><rect width="362" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="362" height="4" fill="#6ad1e7"/><text x="18" y="28" class="l">SLA / PRIORIDADE</text><text x="18" y="63" class="v">Indisponível</text><text x="18" y="86" class="s">sem fonte adicional</text></g><g transform="translate(252 470)"><rect width="790" height="260" rx="10" fill="white" stroke="#cbd7e8"/><text x="22" y="32" class="c">Tickets por status e pipeline</text><text x="22" y="54" class="s">Tabela para localizar a fila; não repetir KPI em gráfico.</text><line x1="22" y1="82" x2="744" y2="82" stroke="#e8eef7"/><text x="22" y="108" class="l">STATUS</text><text x="322" y="108" class="l">TICKETS</text><text x="490" y="108" class="l">PRIORIDADE</text><text x="22" y="146" class="b">Aberto</text><text x="322" y="146" class="s">-</text><text x="490" y="146" class="s">-</text><line x1="22" y1="164" x2="744" y2="164" stroke="#e8eef7"/><text x="22" y="198" class="b">Novo</text><text x="322" y="198" class="s">-</text><text x="490" y="198" class="s">-</text><text x="22" y="238" class="tiny">Chat permanece separado quando a fonte for confirmada.</text></g><g transform="translate(1064 470)"><rect width="504" height="260" rx="10" fill="white" stroke="#cbd7e8"/><text x="22" y="32" class="c">Tendência do volume</text><text x="22" y="54" class="s">Diária/semanal em recorte curto; mensal só em histórico.</text><path d="M26 204 L112 181 L198 192 L284 149 L370 166 L456 122" fill="none" stroke="#6ad1e7" stroke-width="3"/><line x1="26" y1="204" x2="456" y2="204" stroke="#dce4f2"/><text x="22" y="238" class="n">Compacta e subordinada à fila</text></g><g transform="translate(252 758)"><rect width="1316" height="128" rx="10" fill="#0f1d3a"/><text x="22" y="32" class="c" style="fill:#fff">Chat: fonte separada</text><text x="22" y="58" class="s" fill="#b7c3dd">O espaço existe, mas não promete Conversations/Inbox sem contrato real.</text><text x="22" y="91" class="n">Indisponível até confirmação da fonte</text></g></svg>