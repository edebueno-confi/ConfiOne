<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:'Segoe UI',sans-serif}.brand{font-size:16px;font-weight:700;fill:#fff}.nav{font-size:13px;fill:#b7c3dd}.ey{font-size:11px;font-weight:700;letter-spacing:1px;fill:#d93898}.t{font-size:28px;font-weight:700;fill:#162443}.b{font-size:14px;fill:#6b7892}.l{font-size:10px;font-weight:700;letter-spacing:1px;fill:#6b7892}.v{font-size:25px;font-weight:700;fill:#162443}.s{font-size:12px;fill:#6b7892}.c{font-size:15px;font-weight:700;fill:#162443}.n{font-size:11px;font-weight:600;fill:#d93898}.tiny{font-size:10px;fill:#98a3b8}</style><rect width="1600" height="1000" fill="#f4f7fc"/><rect width="216" height="1000" fill="#04133d"/><text x="28" y="34" class="brand">GENIUS SUPPORT OS</text><text x="28" y="58" class="tiny" fill="#7f8ead">COCKPIT OPERACIONAL</text><text x="28" y="125" class="tiny">INTELIGENCIA</text><rect x="16" y="145" width="184" height="42" rx="8" fill="#2f6bff"/><text x="32" y="171" class="nav" fill="white">Dashboard gerencial</text><text x="32" y="218" class="nav">Central de ajuda</text><text x="32" y="264" class="nav">Integracoes</text><text x="32" y="310" class="nav">Historico</text><rect x="216" width="1384" height="64" fill="white" stroke="#dce4f2"/><text x="246" y="38" class="b">Dashboard gerencial / Customer Success</text><text x="1220" y="37" class="tiny">BLUEPRINT V2 - NAO E TELA RUNTIME</text><circle cx="1453" cy="32" r="6" fill="#f5b83d"/><text x="1468" y="37" class="s">denominador pendente</text><text x="252" y="108" class="ey">HUBSPOT · CARTEIRA</text><text x="252" y="142" class="t">Customer Success</text><text x="252" y="169" class="b">Cobertura, lacunas e sinais - sem fingir uma carteira pronta.</text><line x1="252" y1="192" x2="1568" y2="192" stroke="#dce4f2"/><g transform="translate(252 210)"><rect width="1316" height="64" rx="9" fill="white" stroke="#cbd7e8"/><text x="20" y="22" class="l">RECORTE</text><text x="20" y="47" class="s">Posição atual</text><text x="232" y="22" class="l">OWNER</text><text x="232" y="47" class="s">Todos</text><text x="402" y="22" class="l">CONTRATO</text><text x="402" y="47" class="s">Todos</text><text x="572" y="22" class="l">COBERTURA</text><text x="572" y="47" class="s">A definir</text><text x="1132" y="38" class="n">Configurar definicao de carteira -></text></g><text x="252" y="314" class="c">Estrutura de leitura</text><text x="420" y="314" class="s">KPIs conceituais até existir critério formal de cliente CS.</text><g transform="translate(252 334)"><rect width="300" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="300" height="4" fill="#d93898"/><text x="18" y="28" class="l">COBERTURA DE CARTEIRA</text><text x="18" y="63" class="v">Indisponível</text><text x="18" y="86" class="s">denominador não definido</text></g><g transform="translate(570 334)"><rect width="300" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="300" height="4" fill="#5b86ff"/><text x="18" y="28" class="l">CLIENTES COM OWNER</text><text x="18" y="63" class="v">-</text><text x="18" y="86" class="s">campo a validar</text></g><g transform="translate(888 334)"><rect width="300" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="300" height="4" fill="#22c55e"/><text x="18" y="28" class="l">CONTRATO / MRR</text><text x="18" y="63" class="v">-</text><text x="18" y="86" class="s">sem métrica pronta</text></g><g transform="translate(1206 334)"><rect width="362" height="104" rx="9" fill="white" stroke="#cbd7e8"/><rect width="362" height="4" fill="#f5b83d"/><text x="18" y="28" class="l">HEALTH - RISCO</text><text x="18" y="63" class="v">Conceitual</text><text x="18" y="86" class="s">não inferir catálogo geral</text></g><g transform="translate(252 470)"><rect width="636" height="260" rx="10" fill="white" stroke="#cbd7e8"/><text x="22" y="32" class="c">Mapa de cobertura</text><text x="22" y="54" class="s">Lacunas de definição antes de mostrar saúde.</text><rect x="22" y="82" width="176" height="118" rx="8" fill="#fff4d9"/><text x="40" y="112" class="l">1 · DEFINIR</text><text x="40" y="140" class="b">cliente de CS</text><text x="40" y="174" class="tiny">denominador</text><rect x="220" y="82" width="176" height="118" rx="8" fill="#eaf2ff"/><text x="238" y="112" class="l">2 · VALIDAR</text><text x="238" y="140" class="b">campos</text><text x="238" y="174" class="tiny">owner / contrato</text><rect x="418" y="82" width="176" height="118" rx="8" fill="white" stroke="#dce4f2"/><text x="436" y="112" class="l">3 · MEDIR</text><text x="436" y="140" class="b">health</text><text x="436" y="174" class="tiny">só após contrato</text></g><g transform="translate(908 470)"><rect width="660" height="260" rx="10" fill="#0f1d3a"/><text x="22" y="32" class="c" style="fill:#fff">Evolução da carteira</text><text x="22" y="55" class="s" fill="#b7c3dd">Sem série até carteira e período terem definição.</text><line x1="30" y1="206" x2="620" y2="206" stroke="#263a63"/><text x="30" y="238" class="tiny" fill="#7f8ead">A zona temporal permanece contida, não um vazio gigante.</text><text x="430" y="120" class="n" fill="#ff6cbe">Indisponível</text></g><g transform="translate(252 758)"><rect width="1316" height="128" rx="10" fill="white" stroke="#cbd7e8"/><text x="22" y="32" class="c">Detalhe e decisão</text><text x="22" y="58" class="s">Owner, cobertura, engajamento e churn entram em tabela quando houver contrato.</text><text x="22" y="91" class="n">Abrir definicao de carteira -></text><text x="850" y="91" class="tiny">Nenhum health ou cliente ativo é inventado</text></g></svg>