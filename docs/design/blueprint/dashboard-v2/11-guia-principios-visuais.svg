<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:'Segoe UI',sans-serif}.brand{font-size:16px;font-weight:700;fill:#fff}.nav{font-size:13px;fill:#b7c3dd}.ey{font-size:11px;font-weight:700;letter-spacing:1px;fill:#2f6bff}.t{font-size:28px;font-weight:700;fill:#162443}.b{font-size:14px;fill:#6b7892}.s{font-size:12px;fill:#6b7892}.c{font-size:15px;font-weight:700;fill:#162443}.n{font-size:11px;font-weight:600;fill:#2f6bff}.tiny{font-size:10px;fill:#98a3b8}</style><rect width="1600" height="1000" fill="#f4f7fc"/><rect width="216" height="1000" fill="#04133d"/><text x="28" y="34" class="brand">GENIUS SUPPORT OS</text><text x="28" y="58" class="tiny" fill="#7f8ead">COCKPIT OPERACIONAL</text><text x="28" y="125" class="tiny">REFERENCIA V2</text><rect x="16" y="145" width="184" height="42" rx="8" fill="#2f6bff"/><text x="32" y="171" class="nav" fill="white">Principios visuais</text><text x="32" y="218" class="nav">Dashboard gerencial</text><text x="32" y="264" class="nav">Genio em acao</text><rect x="216" width="1384" height="64" fill="white" stroke="#dce4f2"/><text x="246" y="38" class="b">Guia de princípios visuais</text><text x="1220" y="37" class="tiny">BLUEPRINT V2 - NAO E TELA RUNTIME</text><text x="252" y="108" class="ey">SISTEMA VISUAL</text><text x="252" y="142" class="t">Uma leitura, quatro perguntas</text><text x="252" y="169" class="b">Estado -> sinal -> evolucao -> detalhe. A tela não compete consigo mesma.</text><g transform="translate(252 220)"><rect width="294" height="176" rx="12" fill="white" stroke="#cbd7e8"/><text x="22" y="34" class="ey">01</text><text x="22" y="70" class="c">KPI</text><text x="22" y="100" class="s">estado atual</text><text x="22" y="132" class="tiny">valor · contexto · delta</text><text x="22" y="154" class="n">protagonista curto</text></g><g transform="translate(566 220)"><rect width="294" height="176" rx="12" fill="white" stroke="#cbd7e8"/><text x="22" y="34" class="ey">02</text><text x="22" y="70" class="c">Sinal</text><text x="22" y="100" class="s">risco ou atenção</text><text x="22" y="132" class="tiny">cor semântica discreta</text><text x="22" y="154" class="n">ação próxima</text></g><g transform="translate(880 220)"><rect width="294" height="176" rx="12" fill="#0f1d3a"/><text x="22" y="34" class="ey" fill="#5b86ff">03</text><text x="22" y="70" class="c" style="fill:#fff">Tempo</text><text x="22" y="100" class="s" fill="#b7c3dd">micro, semanal ou mensal</text><text x="22" y="132" class="tiny" fill="#7f8ead">só quando acrescenta leitura</text><text x="22" y="154" class="n">sem gráfico ornamental</text></g><g transform="translate(1194 220)"><rect width="374" height="176" rx="12" fill="white" stroke="#cbd7e8"/><text x="22" y="34" class="ey">04</text><text x="22" y="70" class="c">Detalhe</text><text x="22" y="100" class="s">tabela ou breakdown</text><text x="22" y="132" class="tiny">pipeline · aging · origem</text><text x="22" y="154" class="n">localizar próximo trabalho</text></g><g transform="translate(252 440)"><rect width="636" height="286" rx="12" fill="white" stroke="#cbd7e8"/><text x="22" y="36" class="c">Temporalidade por período</text><text x="22" y="74" class="s">Até 31d</text><text x="240" y="74" class="n">KPI + sparkline</text><text x="22" y="118" class="s">32-90d</text><text x="240" y="118" class="n">KPI + semanal compacta</text><text x="22" y="162" class="s">91-365d</text><text x="240" y="162" class="n">KPI + mensal comparativa</text><text x="22" y="206" class="s">&gt; 1 ano</text><text x="240" y="206" class="n">mensal/trimestral</text><line x1="22" y1="232" x2="594" y2="232" stroke="#e8eef7"/><text x="22" y="260" class="tiny">Nunca granularidade diária em série anual.</text></g><g transform="translate(908 440)"><rect width="660" height="286" rx="12" fill="#0f1d3a"/><text x="22" y="36" class="c" style="fill:#fff">Gênio = avatar do sistema</text><circle cx="52" cy="88" r="25" fill="#2f6bff"/><circle cx="44" cy="84" r="4" fill="white"/><circle cx="60" cy="84" r="4" fill="white"/><rect x="37" y="108" width="30" height="38" rx="12" fill="#2f6bff"/><rect x="32" y="119" width="40" height="8" rx="4" fill="#f04aae"/><text x="96" y="92" class="s" fill="#b7c3dd">forma definida · ajuda visual</text><text x="96" y="120" class="s" fill="#b7c3dd">halo e movimento com moderação</text><line x1="22" y1="172" x2="620" y2="172" stroke="#263a63"/><text x="22" y="208" class="tiny" fill="#7f8ead">Não é fantasma · não é espírito · não é dado</text><text x="22" y="244" class="n" fill="#5b86ff">A operação continua legível sem ele</text></g><g transform="translate(252 770)"><rect width="1316" height="108" rx="12" fill="#eaf2ff"/><text x="22" y="36" class="c">Princípio de ouro</text><text x="22" y="68" class="b">A resolução vem de escala e ordem; não de aumentar tudo nem preencher o vazio com gráficos.</text></g><text x="252" y="926" class="tiny">Alta definição · densidade controlada · sem brutalismo · sem maximalismo · sem dados inventados.</text></svg>