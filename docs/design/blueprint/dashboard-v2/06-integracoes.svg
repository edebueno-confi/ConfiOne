<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:'Segoe UI',sans-serif}.brand{font-size:16px;font-weight:700;fill:#fff}.nav{font-size:13px;fill:#b7c3dd}.ey{font-size:11px;font-weight:700;letter-spacing:1px;fill:#2f6bff}.t{font-size:28px;font-weight:700;fill:#162443}.b{font-size:14px;fill:#6b7892}.l{font-size:10px;font-weight:700;letter-spacing:1px;fill:#6b7892}.s{font-size:12px;fill:#6b7892}.c{font-size:15px;font-weight:700;fill:#162443}.n{font-size:11px;font-weight:600;fill:#2f6bff}.tiny{font-size:10px;fill:#98a3b8}</style><rect width="1600" height="1000" fill="#f4f7fc"/><rect width="216" height="1000" fill="#04133d"/><text x="28" y="34" class="brand">GENIUS SUPPORT OS</text><text x="28" y="58" class="tiny" fill="#7f8ead">COCKPIT OPERACIONAL</text><text x="28" y="125" class="tiny">CONFIGURACOES</text><rect x="16" y="145" width="184" height="42" rx="8" fill="#2f6bff"/><text x="32" y="171" class="nav" fill="white">Integracoes</text><text x="32" y="218" class="nav">Fontes do Dashboard</text><text x="32" y="264" class="nav">Historico</text><rect x="216" width="1384" height="64" fill="white" stroke="#dce4f2"/><text x="246" y="38" class="b">Configurações / Integrações</text><text x="1220" y="37" class="tiny">BLUEPRINT V2 - NAO E TELA RUNTIME</text><text x="252" y="108" class="ey">FONTES EXTERNAS</text><text x="252" y="142" class="t">Integracoes</text><text x="252" y="169" class="b">Credenciais protegidas, ativação e origem de cada área.</text><line x1="252" y1="192" x2="1568" y2="192" stroke="#dce4f2"/><rect x="252" y="214" width="1316" height="54" rx="9" fill="#eaf2ff"/><text x="274" y="247" class="s">HubSpot abastece Comercial, CS e Suporte - OMIE abastece Financeiro - nenhum modo alternativo</text><g transform="translate(252 302)"><rect width="636" height="350" rx="12" fill="white" stroke="#cbd7e8"/><rect width="636" height="5" fill="#2f6bff"/><text x="24" y="38" class="ey">OPERACAO</text><text x="24" y="70" class="c">HubSpot</text><text x="24" y="96" class="b">Empresas, negócios e tickets.</text><rect x="24" y="124" width="588" height="52" rx="8" fill="#f4f7fc" stroke="#dce4f2"/><text x="42" y="155" class="s">Integracao ativa</text><text x="24" y="210" class="l">TOKEN DE ACESSO</text><rect x="24" y="222" width="588" height="42" rx="8" fill="white" stroke="#cbd7e8"/><text x="42" y="248" class="tiny">Valor protegido · substituir no Vault</text><text x="24" y="308" class="n">Salvar alterações</text></g><g transform="translate(932 302)"><rect width="636" height="350" rx="12" fill="white" stroke="#cbd7e8"/><rect width="636" height="5" fill="#f04aae"/><text x="24" y="38" class="ey">FINANCEIRO</text><text x="24" y="70" class="c">OMIE</text><text x="24" y="96" class="b">Contas a receber e posição financeira.</text><rect x="24" y="124" width="588" height="52" rx="8" fill="#f4f7fc" stroke="#dce4f2"/><text x="42" y="155" class="s">Integracao ativa</text><text x="24" y="210" class="l">APP KEY / APP SECRET</text><rect x="24" y="222" width="280" height="42" rx="8" fill="white" stroke="#cbd7e8"/><text x="42" y="248" class="tiny">APP_KEY protegido</text><rect x="324" y="222" width="288" height="42" rx="8" fill="white" stroke="#cbd7e8"/><text x="342" y="248" class="tiny">APP_SECRET protegido</text><text x="24" y="308" class="n">Salvar alterações</text></g><g transform="translate(252 700)"><rect width="1316" height="130" rx="10" fill="#0f1d3a"/><text x="22" y="34" class="c" style="fill:#fff">Teste seguro</text><text x="22" y="60" class="s" fill="#b7c3dd">Ação read-only contextual, com resultado sanitizado e auditoria; não transforma configuração em dashboard.</text><text x="22" y="96" class="n" fill="#5b86ff">Testar conexão</text></g></svg>