<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:'Segoe UI',sans-serif}.brand{font-size:16px;font-weight:700;fill:#fff}.nav{font-size:13px;fill:#b7c3dd}.ey{font-size:11px;font-weight:700;letter-spacing:1px;fill:#2f6bff}.t{font-size:28px;font-weight:700;fill:#162443}.b{font-size:14px;fill:#6b7892}.l{font-size:10px;font-weight:700;letter-spacing:1px;fill:#6b7892}.s{font-size:12px;fill:#6b7892}.c{font-size:15px;font-weight:700;fill:#162443}.n{font-size:11px;font-weight:600;fill:#2f6bff}.tiny{font-size:10px;fill:#98a3b8}</style><rect width="1600" height="1000" fill="#f4f7fc"/><rect width="216" height="1000" fill="#04133d"/><text x="28" y="34" class="brand">GENIUS SUPPORT OS</text><text x="28" y="58" class="tiny" fill="#7f8ead">COCKPIT OPERACIONAL</text><text x="28" y="125" class="tiny">CONFIGURACOES</text><rect x="16" y="145" width="184" height="42" rx="8" fill="#2f6bff"/><text x="32" y="171" class="nav" fill="white">Fontes do Dashboard</text><text x="32" y="218" class="nav">Integracoes</text><text x="32" y="264" class="nav">Historico</text><rect x="216" width="1384" height="64" fill="white" stroke="#dce4f2"/><text x="246" y="38" class="b">Configurações / Fontes do Dashboard</text><text x="1220" y="37" class="tiny">BLUEPRINT V2 - NAO E TELA RUNTIME</text><text x="252" y="108" class="ey">ORIGEM E CATALOGACAO</text><text x="252" y="142" class="t">Fontes do Dashboard</text><text x="252" y="169" class="b">Status, atualização e classificação sem parede de cards.</text><text x="1310" y="140" class="n">Atualizar fontes</text><line x1="252" y1="192" x2="1568" y2="192" stroke="#dce4f2"/><g transform="translate(252 214)"><rect width="1316" height="78" rx="10" fill="#fff" stroke="#cbd7e8"/><text x="22" y="30" class="c">Pulso das fontes</text><circle cx="250" cy="27" r="5" fill="#22c55e"/><text x="266" y="32" class="s">HubSpot · status canônico</text><circle cx="520" cy="27" r="5" fill="#22c55e"/><text x="536" y="32" class="s">OMIE · status canônico</text><text x="22" y="58" class="tiny">A faixa resume; detalhes operacionais ficam abaixo.</text></g><g transform="translate(252 330)"><rect width="1316" height="270" rx="10" fill="white" stroke="#cbd7e8"/><text x="22" y="34" class="c">Catálogo de pipelines</text><text x="22" y="58" class="s">Classificar antes de compor KPIs; preservar ausentes e históricos.</text><line x1="22" y1="84" x2="1270" y2="84" stroke="#e8eef7"/><text x="22" y="110" class="l">FONTE</text><text x="230" y="110" class="l">NOME</text><text x="610" y="110" class="l">ÁREA</text><text x="840" y="110" class="l">STATUS</text><text x="1080" y="110" class="l">ACAO</text><text x="22" y="148" class="b">HubSpot</text><text x="230" y="148" class="s">Pipeline não arquivado</text><text x="610" y="148" class="s">A classificar</text><text x="840" y="148" class="s">Ativo</text><text x="1080" y="148" class="n">Configurar</text><line x1="22" y1="168" x2="1270" y2="168" stroke="#e8eef7"/><text x="22" y="206" class="b">OMIE</text><text x="230" y="206" class="s">Contas a receber</text><text x="610" y="206" class="s">Financeiro</text><text x="840" y="206" class="s">Configurado</text><text x="1080" y="206" class="n">Ver origem</text></g><g transform="translate(252 638)"><rect width="636" height="170" rx="10" fill="#0f1d3a"/><text x="22" y="34" class="c" style="fill:#fff">Atualização automática</text><text x="22" y="60" class="s" fill="#b7c3dd">Frequência, última execução e estado do ciclo.</text><text x="22" y="104" class="l" fill="#7f8ead">STATUS</text><text x="22" y="132" class="s" fill="white">Não registrada</text></g><g transform="translate(908 638)"><rect width="660" height="170" rx="10" fill="white" stroke="#cbd7e8"/><text x="22" y="34" class="c">Ações manuais</text><text x="22" y="60" class="s">Uma ação primária; resultado sempre sanitizado.</text><text x="22" y="112" class="n">Sincronizar bases</text><text x="22" y="140" class="tiny">HubSpot -> OMIE, conforme autorização e ciclo real</text></g></svg>