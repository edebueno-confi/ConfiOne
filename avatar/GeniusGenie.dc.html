<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes genieFloat { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-14px) } }
@keyframes genieBob { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-4px) } }
@keyframes armWave { 0%,100%{ transform:rotate(-3deg) } 50%{ transform:rotate(4deg) } }
@keyframes twinkle { 0%,100%{ opacity:.15; transform:scale(.5) } 50%{ opacity:1; transform:scale(1) } }
@keyframes smokeSway { 0%,100%{ transform:translateX(0) rotate(0) } 50%{ transform:translateX(4px) rotate(1.5deg) } }
@keyframes smokeGlow { 0%,100%{ opacity:.35; transform:scale(1) } 50%{ opacity:.6; transform:scale(1.08) } }
@keyframes wispRise { 0%{ opacity:0; transform:translateY(6px) scaleY(.7) } 40%{ opacity:.8 } 100%{ opacity:0; transform:translateY(-26px) scaleY(1.15) } }
@keyframes cardBob { 0%,100%{ transform:translateY(0) rotate(-2deg) } 50%{ transform:translateY(-7px) rotate(2deg) } }
@keyframes thoughtPulse { 0%,100%{ opacity:.4; transform:scale(.85) } 50%{ opacity:1; transform:scale(1.05) } }
@keyframes confettiFall { 0%{ opacity:0; transform:translateY(-8px) rotate(0) } 20%{ opacity:1 } 100%{ opacity:0; transform:translateY(46px) rotate(180deg) } }
@keyframes barGrow { 0%,100%{ transform:scaleY(.7) } 50%{ transform:scaleY(1) } }
@keyframes tipSpark { 0%,100%{ opacity:.3; transform:scale(.6) } 50%{ opacity:1; transform:scale(1.2) } }
</style>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:470},&quot;pose&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;welcome&quot;,&quot;present&quot;,&quot;think&quot;,&quot;celebrate&quot;,&quot;magic&quot;,&quot;shrug&quot;],&quot;default&quot;:&quot;magic&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pose&quot;},&quot;expression&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;happy&quot;,&quot;wink&quot;,&quot;wow&quot;],&quot;default&quot;:&quot;happy&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pose&quot;},&quot;interactive&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Pose&quot;}}">
class Component extends DCLogic {
  state = { exp: null };
  get exp() { return this.state.exp ?? (this.props.expression || 'happy'); }
  get interactive() { return String(this.props.interactive) !== 'false'; }

  componentDidMount() {
    if (!this.interactive) return;
    this._onMove = (e) => {
      this._pt = { x: e.clientX, y: e.clientY };
      if (!this._raf) this._raf = requestAnimationFrame(() => { this._raf = null; this.track(); });
    };
    window.addEventListener('mousemove', this._onMove, { passive: true });
  }
  componentWillUnmount() {
    if (this._onMove) window.removeEventListener('mousemove', this._onMove);
    if (this._raf) cancelAnimationFrame(this._raf);
  }
  track() {
    const svg = this._svg, pt = this._pt;
    if (!svg || !pt || !svg.createSVGPoint) return;
    const eyes = svg.querySelectorAll('.eye-track');
    const p = svg.createSVGPoint(); p.x = pt.x; p.y = pt.y;
    eyes.forEach((g) => {
      const m = g.getScreenCTM(); if (!m) return;
      const loc = p.matrixTransform(m.inverse());
      const cx = +g.dataset.cx, cy = +g.dataset.cy;
      let dx = loc.x - cx, dy = loc.y - cy;
      const maxX = 5.5, maxY = 6.5;
      const d = Math.hypot(dx, dy) || 1;
      const s = Math.min(1, 10 / d);
      dx = Math.max(-maxX, Math.min(maxX, dx * s));
      dy = Math.max(-maxY, Math.min(maxY, dy * s));
      const pupil = g.querySelector('.pupil');
      if (pupil) pupil.setAttribute('transform', `translate(${dx.toFixed(1)} ${dy.toFixed(1)})`);
    });
  }

  renderVals() {
    const exp = this.exp;
    const poses = ['welcome', 'present', 'think', 'celebrate', 'magic', 'shrug'];
    const pose = poses.includes(this.props.pose) ? this.props.pose : 'magic';
    const cycle = () => {
      if (!this.interactive) return;
      const list = ['happy', 'wink', 'wow'];
      const i = list.indexOf(exp);
      this.setState({ exp: list[(i + 1) % list.length] });
    };
    return {
      svgRef: (el) => { this._svg = el; },
      onGenieClick: cycle,
      leftRest: pose === 'magic' || pose === 'welcome' || pose === 'present' || pose === 'think',
      poseMagic: pose === 'magic',
      poseWelcome: pose === 'welcome',
      posePresent: pose === 'present',
      poseThink: pose === 'think',
      poseCelebrate: pose === 'celebrate',
      poseShrug: pose === 'shrug',
      leftRound: exp === 'happy' || exp === 'wow',
      leftClosed: exp === 'wink',
      rightBig: exp === 'wow',
      rightNormal: exp !== 'wow',
      mouthSmile: exp === 'happy',
      mouthGrin: exp === 'wink',
      mouthO: exp === 'wow',
    };
  }
}
</script>
</body>
</html>
